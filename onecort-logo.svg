<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 96" width="430" height="96" role="img" aria-label="ONECORT">
  <!-- Знак: падел-корт сверху. Рамка — стеклянные стены, красная линия — сетка. -->
  <g fill="none" stroke="#0a2456" stroke-width="7" stroke-linejoin="round">
    <rect x="5.5" y="17.5" width="86" height="61" rx="7" />
  </g>
  <g stroke="#0a2456" stroke-width="4" stroke-linecap="round">
    <line x1="24" y1="30" x2="24" y2="66" />
    <line x1="73" y1="30" x2="73" y2="66" />
    <line x1="24" y1="48" x2="73" y2="48" />
  </g>
  <line x1="48.5" y1="14" x2="48.5" y2="82" stroke="#d3342d" stroke-width="6" stroke-linecap="round" />

  <!-- Слово: ONE — тёмно-синий, CORT — красный -->
  <text x="112" y="66"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="1.5" fill="#0a2456">ONE<tspan fill="#d3342d">CORT</tspan></text>
</svg>
