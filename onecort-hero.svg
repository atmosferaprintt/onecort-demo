<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <!--
    Обложка демо: ночной падел-корт. Вместо фотографии — векторная сцена,
    чтобы демо ни к какому реальному клубу и человеку не отсылало.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03102a" />
      <stop offset="55%" stop-color="#0a2456" />
      <stop offset="100%" stop-color="#061a3d" />
    </linearGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123a7a" />
      <stop offset="100%" stop-color="#071c42" />
    </linearGradient>

    <radialGradient id="lamp" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#a8c8ff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#a8c8ff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.09" />
    </linearGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)" />

  <!-- Свет прожекторов -->
  <g>
    <ellipse cx="180" cy="40" rx="260" ry="300" fill="url(#lamp)" />
    <ellipse cx="600" cy="10" rx="300" ry="330" fill="url(#lamp)" />
    <ellipse cx="1020" cy="40" rx="260" ry="300" fill="url(#lamp)" />
  </g>

  <!-- Мачты освещения -->
  <g stroke="#0e2e63" stroke-width="6" opacity="0.9">
    <line x1="180" y1="0" x2="180" y2="120" />
    <line x1="600" y1="0" x2="600" y2="96" />
    <line x1="1020" y1="0" x2="1020" y2="120" />
  </g>
  <g fill="#dbe8ff" opacity="0.85">
    <rect x="140" y="104" width="80" height="16" rx="6" />
    <rect x="560" y="80" width="80" height="16" rx="6" />
    <rect x="980" y="104" width="80" height="16" rx="6" />
  </g>

  <!-- Пол корта в перспективе -->
  <path d="M120 900 L 1080 900 L 880 430 L 320 430 Z" fill="url(#floor)" />

  <!-- Разметка -->
  <g stroke="#9fc0ff" stroke-opacity="0.5" stroke-width="3" fill="none">
    <path d="M320 430 L 120 900" />
    <path d="M880 430 L 1080 900" />
    <path d="M600 430 L 600 900" stroke-opacity="0.35" />
    <path d="M392 600 L 808 600" />
    <path d="M355 700 L 845 700" stroke-opacity="0.3" />
  </g>

  <!-- Сетка по центру корта -->
  <g>
    <rect x="330" y="486" width="540" height="86" fill="#0a2044" opacity="0.55" />
    <g stroke="#c9dcff" stroke-opacity="0.35" stroke-width="1.5">
      <line x1="330" y1="500" x2="870" y2="500" />
      <line x1="330" y1="520" x2="870" y2="520" />
      <line x1="330" y1="540" x2="870" y2="540" />
      <line x1="330" y1="560" x2="870" y2="560" />
    </g>
    <rect x="330" y="480" width="540" height="8" rx="4" fill="#e8f0ff" opacity="0.85" />
    <rect x="326" y="480" width="8" height="92" fill="#d3342d" />
    <rect x="866" y="480" width="8" height="92" fill="#d3342d" />
  </g>

  <!-- Стеклянные стены -->
  <g>
    <path d="M320 430 L 880 430 L 880 250 L 320 250 Z" fill="url(#glass)" />
    <g stroke="#8fb4ff" stroke-opacity="0.35" stroke-width="3" fill="none">
      <rect x="320" y="250" width="560" height="180" />
      <line x1="507" y1="250" x2="507" y2="430" />
      <line x1="694" y1="250" x2="694" y2="430" />
    </g>
    <!-- боковые стёкла уходят в перспективу -->
    <path d="M320 250 L 320 430 L 120 900 L 120 700 Z" fill="url(#glass)" />
    <path d="M880 250 L 880 430 L 1080 900 L 1080 700 Z" fill="url(#glass)" />
  </g>

  <!-- Блики на стекле -->
  <g opacity="0.5" filter="url(#soft)">
    <ellipse cx="430" cy="300" rx="90" ry="34" fill="#ffffff" opacity="0.16" />
    <ellipse cx="800" cy="330" rx="70" ry="26" fill="#ffffff" opacity="0.12" />
  </g>

  <!-- Мяч в полёте и его след -->
  <g>
    <path d="M250 760 C 420 640, 640 590, 900 520" stroke="#f2ff6b" stroke-opacity="0.28" stroke-width="4" fill="none" stroke-dasharray="2 16" stroke-linecap="round" />
    <circle cx="900" cy="520" r="13" fill="#e8ff5a" />
    <path d="M890 512 a 16 16 0 0 0 20 16" stroke="#b9cc3a" stroke-width="2" fill="none" />
  </g>

  <!-- Зерно поверх сцены -->
  <rect width="1200" height="900" filter="url(#grain)" opacity="0.12" style="mix-blend-mode:overlay" />
  <rect width="1200" height="900" fill="#03102a" opacity="0.18" />
</svg>
